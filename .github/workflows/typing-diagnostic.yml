name: Long chat typing diagnostic
on:
  push:
    branches: [diagnostic/long-chat-typing-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      UNSLOTH_DISABLE_UPDATE_CHECK: '1'
      UNSLOTH_SKIP_AUTOSTART: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install current Studio backend locally without inference dependencies
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./install.ps1 --local --no-torch --skip-autostart
          if ($LASTEXITCODE -ne 0) { throw 'Studio installation failed' }
          "STUDIO_PYTHON=$env:USERPROFILE\.unsloth\studio\unsloth_studio\Scripts\python.exe" >> $env:GITHUB_ENV
      - name: Build exact release frontends
        shell: bash
        run: |
          set -euo pipefail
          for version in v0.1.913-beta v0.1.914-beta; do
            git fetch https://github.com/unslothai/unsloth "refs/tags/$version:refs/tags/$version"
            mkdir -p "temp/typing-versions/$version"
            git archive "$version" studio/frontend | tar -x -C "temp/typing-versions/$version"
            (cd "temp/typing-versions/$version/studio/frontend" && npm ci --ignore-scripts --no-fund --no-audit && npm run build)
          done
      - name: Install browser driver
        run: python -m pip install playwright==1.62.0
      - name: Compare Edge typing with Reduce Motion Off and On
        run: python tests/studio/playwright_typing_diagnostic.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-edge-typing
          path: |
            logs/typing-diagnostic/*.json
            logs/typing-diagnostic/*.png
            logs/typing-diagnostic/*.log
          retention-days: 7
