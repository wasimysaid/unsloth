name: Windows installer architecture staging
on:
  push:
    branches: [staging/windows-installer-arch-20261120]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            host: x64
          - os: windows-11-arm
            host: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($arch -ne '${{ matrix.host }}') { throw "Unexpected runner: $arch" }
          .github/scripts/prefetch-tauri-windows-tools.ps1 -TauriCliVersion 'tauri-cli 2.10.1'
          python -m pip install 'Pillow==12.1.1'
          python .github/scripts/test-arch-staging.py $arch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-${{ matrix.host }}
          path: windows-${{ matrix.host }}.png
          if-no-files-found: error
