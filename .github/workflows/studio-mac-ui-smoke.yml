{
  "name": "Workbench explicit matrix",
  "run-name": "workbench:${{ inputs.operation_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "operation_id": {
          "required": true,
          "type": "string"
        },
        "subject_sha": {
          "required": true,
          "type": "string"
        },
        "subject_repository": {
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "experiment": {
      "name": "${{ matrix.id }}",
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 15,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 1,
        "matrix": {
          "include": [
            {
              "id": "macos-history",
              "runner": "macos-26",
              "python": "3.12",
              "gpu": false
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "${{ inputs.subject_repository }}",
            "ref": "${{ inputs.subject_sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e",
          "with": {
            "python-version": "${{ matrix.python }}"
          }
        },
        {
          "name": "Prepare task environment",
          "shell": "bash",
          "run": "uv venv --python '${{ matrix.python }}' .venv"
        },
        {
          "name": "Run exact subject and record execution identity",
          "shell": "bash",
          "env": {
            "SUBJECT_SHA": "${{ inputs.subject_sha }}",
            "WORKFLOW_SHA": "${{ github.sha }}",
            "CELL_ID": "${{ matrix.id }}",
            "REQUIRE_GPU": "${{ matrix.gpu }}",
            "EXPERIMENT_ARGV": "[\"python\", \"-c\", \"import json\\nimport os\\nimport pathlib\\nimport platform\\nimport subprocess\\nimport tempfile\\n\\nbase = 'a61d6394a66068986ac85805af2cdb60cc1f8746'\\nsource = pathlib.Path('studio/src-tauri/src/main.rs').read_text()\\nassert 'let _ = fix_path_env::fix();' in source\\nassert 'c4c45d503ea115a839aae718d02f79e7c7f0f673' in pathlib.Path('studio/src-tauri/Cargo.lock').read_text()\\nresults = []\\nwith tempfile.TemporaryDirectory() as directory:\\n    root = pathlib.Path(directory)\\n    (root / 'src').mkdir()\\n    (root / 'Cargo.toml').write_text('[package]\\\\nname=\\\"history-probe\\\"\\\\nversion=\\\"0.1.0\\\"\\\\nedition=\\\"2021\\\"\\\\n[dependencies]\\\\nfix-path-env={git=\\\"https://github.com/tauri-apps/fix-path-env-rs\\\",rev=\\\"c4c45d503ea115a839aae718d02f79e7c7f0f673\\\"}\\\\n')\\n    (root / 'src/main.rs').write_text('fn main(){fix_path_env::fix().unwrap();println!(\\\"PATH={}\\\", std::env::var(\\\"PATH\\\").unwrap());}')\\n    subprocess.run(['cargo', 'build', '--manifest-path', str(root / 'Cargo.toml')], check=True, timeout=180)\\n    for shell in ('/bin/bash', '/bin/zsh'):\\n        version = subprocess.check_output([shell, '--version'], text=True).splitlines()[0]\\n        for terminal in (False, True):\\n            home = root / (pathlib.Path(shell).name + ('-terminal' if terminal else '-gui'))\\n            home.mkdir()\\n            seed = b'echo previous-command-one\\\\necho previous-command-two\\\\n'\\n            hist = home / '.bash_history'\\n            hist.write_bytes(seed)\\n            zhist = home / '.zsh_history'\\n            zhist.write_bytes(seed)\\n            (home / '.bash_profile').write_text('export PATH=\\\"/isolated-shell-path:$PATH\\\"\\\\n')\\n            (home / '.zshrc').write_text('export PATH=\\\"/isolated-shell-path:$PATH\\\"\\\\nHISTFILE=\\\"$HOME/.zsh_history\\\"\\\\nHISTSIZE=1000\\\\nSAVEHIST=1000\\\\n')\\n            env = {'HOME':str(home),'SHELL':shell,'PATH':'/usr/bin:/bin:/usr/sbin:/sbin','TERM':'dumb','UNSLOTHAI_ENV_LOADED':'1','GPU_USAGE_LINK_LOADED':'1','JUPYTER_AUTO_ENABLE_LOADED':'1','LC_BYOBU':'0'}\\n            if terminal:\\n                env.update(TERM_PROGRAM='Apple_Terminal', TERM_SESSION_ID='UNSLOTH-ISOLATED-PROBE')\\n            run = subprocess.run([str(root / 'target/debug/history-probe')], env=env, stdin=subprocess.DEVNULL, start_new_session=True, capture_output=True, text=True, timeout=30)\\n            result = {'shell':shell,'version':version,'terminal_env':terminal,'exit':run.returncode,'stdout':run.stdout,'stderr':run.stderr,'before':seed.decode(),'bash_after':hist.read_text(),'zsh_after':zhist.read_text(),'preserved':hist.read_bytes()==seed and zhist.read_bytes()==seed,'path_imported':'/isolated-shell-path:' in run.stdout}\\n            print(json.dumps(result),flush=True)\\n            results.append(result)\\nreport = {'base':base,'platform':platform.platform(),'architecture':platform.machine(),'coverage':'actual locked startup fix_path_env::fix call; not full desktop GUI','results':results}\\npathlib.Path('workbench-results').mkdir(exist_ok=True)\\npathlib.Path('workbench-results/history-results.json').write_text(json.dumps(report,indent=2))\\nassert all(r['exit']==0 and r['path_imported'] for r in results), 'startup path did not complete'\\nassert all(r['preserved'] for r in results), 'startup deleted seeded history'\\n\"]"
          },
          "run": "VENV_PY=.venv/bin/python\nif [ -x .venv/Scripts/python.exe ]; then VENV_PY=.venv/Scripts/python.exe; fi\n\"$VENV_PY\" - <<'WORKBENCH_PY'\nimport json, os, pathlib, platform, subprocess, sys\nroot = pathlib.Path(\"workbench-results\"); root.mkdir(exist_ok=True)\nactual = subprocess.check_output([\"git\", \"rev-parse\", \"HEAD\"], text=True).strip()\nif actual != os.environ[\"SUBJECT_SHA\"]: raise SystemExit(\"subject SHA mismatch\")\nprovenance = {\"source_sha\": actual, \"os\": platform.system(), \"architecture\": platform.machine(), \"python\": sys.version, \"cell\": os.environ[\"CELL_ID\"], \"workflow_sha\": os.environ[\"WORKFLOW_SHA\"], \"run_id\": os.environ[\"GITHUB_RUN_ID\"], \"run_attempt\": os.environ[\"GITHUB_RUN_ATTEMPT\"]}\ntry:\n    gpu = subprocess.run([\"nvidia-smi\", \"--query-gpu=name,uuid,driver_version\", \"--format=csv,noheader\"], capture_output=True, text=True)\n    provenance[\"gpu\"] = gpu.stdout if gpu.returncode == 0 else None\nexcept FileNotFoundError:\n    provenance[\"gpu\"] = None\n(root / \"provenance.json\").write_text(json.dumps(provenance, indent=2))\nif os.environ[\"REQUIRE_GPU\"] == \"true\" and not provenance[\"gpu\"]: raise SystemExit(\"required GPU unavailable\")\nos.environ[\"PATH\"] = str(pathlib.Path(sys.executable).parent) + os.pathsep + os.environ.get(\"PATH\", \"\")\nwith (root / \"stdout.log\").open(\"w\") as out, (root / \"stderr.log\").open(\"w\") as err:\n    result = subprocess.run(json.loads(os.environ[\"EXPERIMENT_ARGV\"]), stdout=out, stderr=err)\n(root / \"result.json\").write_text(json.dumps({\"exit_code\": result.returncode, \"assertions_verified\": False}))\nraise SystemExit(result.returncode)\nWORKBENCH_PY"
        },
        {
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "if": "always()",
          "with": {
            "name": "workbench-${{ inputs.operation_id }}-${{ matrix.id }}",
            "path": "workbench-results",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
