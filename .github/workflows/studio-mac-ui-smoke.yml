# Disposable, secret-free PR #11910 cross-OS desktop window experiment.
# This file exists only on evidence/pr-11910-cross-os-tauri, not fork main.
name: Workbench PR 11910 native desktop geometry
run-name: workbench:${{ inputs.operation_id }}
on:
  workflow_dispatch:
    inputs:
      operation_id:
        required: true
        type: string
      subject_sha:
        required: true
        type: string
      subject_repository:
        required: true
        type: string
permissions:
  contents: read
jobs:
  experiment:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { id: macos-14, runner: macos-14 }
          - { id: windows-2022, runner: windows-2022 }
    steps:
      - name: Restrict the subject to exact PR revisions
        shell: bash
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
          SUBJECT_REPOSITORY: ${{ inputs.subject_repository }}
        run: |
          test "$SUBJECT_REPOSITORY" = unslothai/unsloth
          case "$SUBJECT_SHA" in
            ed55faabd7da8616a7202e9f6c20e771c56c83a9|e617bf1f400d44f8be406b6939271a204883c8a3) ;;
            *) echo 'Unexpected subject SHA'; exit 1 ;;
          esac
      - name: Checkout exact tested subject (no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.subject_repository }}
          ref: ${{ inputs.subject_sha }}
          persist-credentials: false
      - name: Checkout immutable workflow probe, not the subject's probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: workbench-probe
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: '3.11'
      - name: Build and measure real Tauri windows (clean setup and installed saved layout)
        shell: bash
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          CELL_ID: ${{ matrix.id }}
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          uv venv --python 3.11 .venv
          if test -f .venv/Scripts/python.exe; then
            .venv/Scripts/python.exe workbench-probe/.github/scripts/desktop-cross-os-window-probe.py
          else
            .venv/bin/python workbench-probe/.github/scripts/desktop-cross-os-window-probe.py
          fi
      - name: Retain probe, build logs and earliest visible screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workbench-${{ inputs.operation_id }}-${{ matrix.id }}
          path: workbench-results
          if-no-files-found: warn
          retention-days: 7
