name: Tag the source-backed fork desktop release v0.1.9028-beta
on:
  push:
    branches: [staging/tag-source-backend-9028]
permissions:
  contents: write
jobs:
  tag:
    if: github.repository == 'wasimysaid/unsloth'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=691b7f4ee0f53afdcbe9333323222ba91f44ed4f
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/desktop-source-backend" --jq .object.sha)" = "$sha"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v0.1.9028-beta -f sha="$sha"
