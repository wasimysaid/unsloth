name: Desktop sccache benchmark (fork only)
on:
  push:
    branches: [perf/desktop-ci-build-experiments]
    paths: [.github/workflows/desktop-sccache-benchmark.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-sccache-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.repository == 'wasimysaid/unsloth'
    name: ${{ matrix.label }} / sccache-fat-1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: linux-x64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu}
          - {label: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {label: windows-x64, runner: windows-latest, target: x86_64-pc-windows-msvc}
          - {label: windows-arm64, runner: windows-latest, target: aarch64-pc-windows-msvc}
          - {label: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin}
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
      CARGO_INCREMENTAL: '0'
      UNSLOTH_DESKTOP_BACKEND_VERSION: '2026.10.9'
      UNSLOTH_DESKTOP_SOURCE_BACKEND: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ runner.temp }}/desktop-sccache
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf || { apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf; }'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
      - name: Install pinned sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.19.0
      - name: Restore compiler result cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: desktop-sccache-v1-${{ matrix.target }}-${{ hashFiles('studio/src-tauri/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: desktop-sccache-v1-${{ matrix.target }}-
      - name: Audit frontend lockfiles
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/lockfile_supply_chain_audit.py
      - name: Build pinned frontend
        working-directory: studio/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: Compile, rebuild and compare hashes
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" .github/scripts/benchmark-desktop-build.py \
            --label '${{ matrix.label }}-sccache-fat-1' \
            --target '${{ matrix.target }}' --output benchmark-results
      - name: Record compiler cache statistics
        if: always()
        shell: bash
        run: |
          mkdir -p benchmark-results
          sccache --show-stats --stats-format json > benchmark-results/sccache-stats.json
          sccache --show-stats
          sccache --stop-server
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sccache-${{ matrix.label }}
          path: benchmark-results
          if-no-files-found: warn
          retention-days: 7
