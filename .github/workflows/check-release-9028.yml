name: Check published fork Windows installers v0.1.9028-beta
on:
  push:
    branches: [staging/verify-source-backend-9028]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cpu: X64
            wrong: Unsloth-Desktop-Windows-ARM64.exe
            machine: 0x8664
          - os: windows-11-arm
            cpu: Arm64
            wrong: Unsloth-Desktop-Windows-x64.exe
            machine: 0xaa64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cpu = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($cpu -ne '${{ matrix.cpu }}') { throw "Unexpected host $cpu" }
          $dest = Join-Path $env:RUNNER_TEMP 'Unsloth Test Install'
          gh release download v0.1.9028-beta -R wasimysaid/unsloth -p '${{ matrix.wrong }}' -p Unsloth-Desktop-Windows.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install Pillow==12.1.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python .github/scripts/check-published-warning.py '${{ matrix.wrong }}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          function Run-Setup($name,$expected) {
            $file = Get-Item $name
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "$name signature is $($signature.Status)" }
            $p = Start-Process $file.FullName -ArgumentList "/S /NS /D=$dest" -PassThru
            if (-not $p.WaitForExit(120000)) { throw "$name timed out" }
            Write-Host "$name exited $($p.ExitCode) on $cpu"
            if ($p.ExitCode -ne $expected) { throw "$name expected $expected" }
          }
          Run-Setup '${{ matrix.wrong }}' 1633
          if (Test-Path $dest) { throw 'Mismatched installer created the installation directory' }
          Run-Setup 'Unsloth-Desktop-Windows.exe' 0
          $exe = Get-Item "$dest/unsloth-studio.exe"
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $machine = [BitConverter]::ToUInt16($bytes,[BitConverter]::ToInt32($bytes,60)+4)
          Write-Host ("Installed {0}, PE 0x{1:X4}" -f $exe.VersionInfo.ProductVersion,$machine)
          if ($machine -ne ${{ matrix.machine }} -or $exe.VersionInfo.ProductVersion -ne '0.1.9028-beta') { throw 'Wrong installed app' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: warning-${{ matrix.cpu }}
          path: windows-*.png
          if-no-files-found: error
